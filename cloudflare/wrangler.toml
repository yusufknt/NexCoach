name = "nexcoach-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# D1 Database
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "nexcoach-db"
database_id = "01550f59-8359-4697-9d71-ddb21793e744"
migrations_dir = "d1/migrations"

# ============================================
# R2 Storage Buckets
# ============================================
[[r2_buckets]]
binding = "R2_PROGRAMS"
bucket_name = "nexcoach-programs"

[[r2_buckets]]
binding = "R2_AVATARS"
bucket_name = "nexcoach-avatars"

[[r2_buckets]]
binding = "R2_PROGRESS_PHOTOS"
bucket_name = "nexcoach-progress-photos"

[[r2_buckets]]
binding = "R2_MONTHLY_REPORTS"
bucket_name = "nexcoach-monthly-reports"

# ============================================
# Environment Variables
# ============================================
[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "*"
API_SECRET = "nexcoach_prod_sec_2026_cf"

# Production secrets (wrangler secret put ile eklenir):
# SUPABASE_URL - Supabase read-only erişim (migration için)
# SUPABASE_SERVICE_KEY - Supabase service role key (migration için)
# API_SECRET - Worker API koruma anahtarı
# JWT_SECRET - Token doğrulama (FAZ 2)
