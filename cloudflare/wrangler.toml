name = "nexcoach-api"
main = "src/index.ts"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat"]

# ============================================
# D1 Database
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "nexcoach-db"
database_id = "01550f59-8359-4697-9d71-ddb21793e744"
migrations_dir = "d1/migrations"

# ============================================
# R2 Storage Buckets
# ============================================
[[r2_buckets]]
binding = "R2_PROGRAMS"
bucket_name = "nexcoach-programs"

[[r2_buckets]]
binding = "R2_AVATARS"
bucket_name = "nexcoach-avatars"

[[r2_buckets]]
binding = "R2_PROGRESS_PHOTOS"
bucket_name = "nexcoach-progress-photos"

[[r2_buckets]]
binding = "R2_MONTHLY_REPORTS"
bucket_name = "nexcoach-monthly-reports"

# ============================================
# Environment Variables
# ============================================
[vars]
ENVIRONMENT = "production"
# Browser requests use the same-origin Vercel auth proxy. Keep direct
# cross-origin Worker access closed unless an explicit origin is required.
CORS_ORIGIN = ""

# ============================================
# Authentication Rate Limiting (10 attempts/minute/location/key)
# ============================================
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Production secrets (wrangler secret put ile eklenir):
# SUPABASE_URL - Supabase read-only erişim (migration için)
# SUPABASE_SERVICE_KEY - Supabase service role key (migration için)
# API_SECRET - Worker API koruma anahtarı
# URL_SIGNING_SECRET - R2 süreli URL imzalama anahtarı
# JWT_SECRET - Token doğrulama (FAZ 2)
